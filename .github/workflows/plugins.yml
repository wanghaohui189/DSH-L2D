name: Portable plugin checks

on:
  push:
    paths:
      - 'integrations/**'
      - 'apps/android/motion/**'
      - 'apps/android/app/src/main/assets/soullink/**'
      - 'tools/check_plugins.py'
      - 'requirements-plugins-dev.txt'
      - '.github/workflows/plugins.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - 'apps/android/motion/**'
      - 'apps/android/app/src/main/assets/soullink/**'
      - 'tools/check_plugins.py'
      - 'requirements-plugins-dev.txt'
      - '.github/workflows/plugins.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-plugin-tests:
    name: Plugin syntax and offline unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install declared development test dependency
        run: python -m pip install -r requirements-plugins-dev.txt
      - name: Run actual plugin checks
        run: python tools/check_plugins.py

  motion-bundle-rebuild:
    name: Rebuild the motion bundle and compare with the committed asset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build bundle from pinned sources
        working-directory: apps/android/motion
        run: npm ci && npm run build
      - name: Fail if the committed bundle is not reproducible from source
        run: git diff --ignore-cr-at-eol --exit-code -- apps/android/app/src/main/assets/soullink/performance.bundle.js
